[graph]
targets = []
all-features = false

[advisories]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "BSL-1.0", "CC0-1.0", "Apache-2.0 WITH LLVM-exception", "CDLA-Permissive-2.0", "LicenseRef-PolyForm-Shield-1.0.0", "LicenseRef-PolyForm-Noncommercial-1.0.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
skip = [
    { crate = "getrandom" },
    { crate = "hashbrown" },
    { crate = "windows-sys" },
    { crate = "windows-targets" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/DangerousPrototypes/BusPirate-BPIO2-flatbuffer-interface",
    "https://github.com/forkwright/epitelesis.git",
    "https://github.com/forkwright/koinon",
]
