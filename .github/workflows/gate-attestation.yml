# Canonical hybrid gate: a validated Gate-Passed trailer takes the attestation
# path; every other PR and every main push runs the actual Rust gate below.
name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# The reusable gate has its own canonical concurrency key. This caller key is
# intentionally distinct so the nested workflow does not cancel itself.
concurrency:
  group: >-
    cheirismos-caller-${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha || github.ref
    }}
  cancel-in-progress: true

jobs:
  gate:
    uses: forkwright/.github/.github/workflows/hybrid-gate.yml@5556cb9e05327f855ccc208080fb1924cf7e8264
    with:
      fmt_cmd: cargo fmt --all -- --check
      check_cmd: cargo check --workspace --all-targets
      clippy_cmd: cargo clippy --workspace --all-targets -- -D warnings
      nextest_cmd: cargo nextest run --workspace
      doctest_cmd: cargo test --workspace --doc
      needs_fleet_repo_token: false
      full_gate_timeout_minutes: 45
      ai_attribution_check: true
      docs_only_exemption: true
  # Kanon is private. Only accepted main commits may use this separate,
  # non-required lint job. The environment permits the main branch only and
  # holds a deploy key with read-only access to the Kanon repository alone.
  kanon-lint:
    name: kanon lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: kanon-standards
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Require scoped standards credential
        env:
          KANON_READ_KEY: ${{ secrets.KANON_STANDARDS_READ_KEY }}
        run: |
          if [ -z "$KANON_READ_KEY" ]; then
            echo '::error::The kanon-standards environment needs its read-only deploy key.'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cheirismos
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: forkwright/kanon
          ref: ca93807557555142b600a058c8faf6adc1cde389
          path: kanon
          ssh-key: ${{ secrets.KANON_STANDARDS_READ_KEY }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          matcher: false
          rust-src-dir: kanon

      # WHY: neither private source, diagnostics, nor compiled artifacts may
      # enter public logs, annotations, caches, or uploaded artifacts. These
      # files remain on this job's ephemeral runner. Failure is still visible.
      - name: Build kanon
        working-directory: kanon
        run: |
          if ! cargo build --locked --package pragma --bin kanon --no-default-features \
            > "$RUNNER_TEMP/kanon-build.log" 2>&1; then
            echo '::error::Pinned Kanon build failed. Reproduce privately at the workflow revision.'
            exit 1
          fi
          test "$(target/debug/kanon build-sha)" = "$(git rev-parse HEAD)"

      - name: Lint standards errors
        working-directory: cheirismos
        run: |
          if ! ../kanon/target/debug/kanon lint . --summary --min-severity error \
            > "$RUNNER_TEMP/kanon-lint.log" 2>&1; then
            echo '::error::Kanon standards lint failed. Run the pinned Kanon lint privately for diagnostics.'
            exit 1
          fi
          echo 'Kanon standards lint passed at error severity.'
